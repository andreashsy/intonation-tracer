<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Intonation Tracer</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <h1 class="file-name" id="file-name">Intonation Tracer</h1>
        <button type="button" id="load-another" class="secondary" hidden>Load another file</button>
      </header>

      <!-- Empty / error state -->
      <section id="drop-zone" class="drop-zone" tabindex="0" aria-describedby="drop-hint">
        <p class="drop-title">Drop an audio or video file, or <label for="file-input" class="link">choose one</label>.</p>
        <p id="drop-hint" class="hint">MP3, WAV, M4A, OGG, MP4, WebM or MOV · up to <span id="limit-text">10 minutes</span></p>
        <p id="error" class="error" role="alert" hidden></p>
        <input type="file" id="file-input" accept="audio/*,video/*,.mp3,.wav,.m4a,.ogg,.mp4,.webm,.mov" class="visually-hidden" />
      </section>

      <!-- Decoding / analyzing -->
      <section id="progress" class="progress" hidden>
        <p id="progress-label" aria-live="polite">Decoding…</p>
        <progress id="progress-bar" max="1" value="0"></progress>
        <button type="button" id="cancel" class="secondary">Cancel</button>
      </section>

      <!-- Ready -->
      <section id="viewer" class="viewer" hidden>
        <div class="trace-wrap" id="trace-wrap">
          <canvas id="trace-canvas" role="img" aria-label="Pitch trace"></canvas>
          <canvas id="overlay-canvas" aria-hidden="true"></canvas>
          <p id="no-voice" class="no-voice" hidden>No speech detected in this file.</p>
        </div>
        <div class="controls">
          <button type="button" id="play" class="play" aria-label="Play">▶</button>
          <span id="time-current" class="time">0:00.0</span>
          <input type="range" id="seek" min="0" max="1" step="0.01" value="0" aria-label="Seek" />
          <span id="time-total" class="time">0:00.0</span>
        </div>
      </section>
    </main>
    <audio id="audio" preload="auto" hidden></audio>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
